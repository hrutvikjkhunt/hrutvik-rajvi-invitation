<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Khunt Parivaar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <audio id="bgmusic" loop>
        <source src="music/sound1.mp3" type="audio/mpeg">
    </audio>


    <div class="container">

        <img src="assets/1.png" class="page">
        <img src="assets/2.png" class="page">
        <img src="assets/3.png" class="page">
        <img src="assets/4.png" class="page">
        <img src="assets/5.png" class="page">
        <img src="assets/6.png" class="page">
        <img src="assets/7.png" class="page">

    </div>

</body>

</html>

<script>
  let started = false;
  const audio = document.getElementById("bgmusic");

  function startMusic() {
    if (!started) {
      audio.play();
      started = true;

      document.removeEventListener('scroll', startMusic);
      document.removeEventListener('touchstart', startMusic);
      document.removeEventListener('click', startMusic);
      document.removeEventListener('pointermove', startMusic);
      document.removeEventListener('wheel', startMusic);
    }
  }

  document.addEventListener('scroll', startMusic);
  document.addEventListener('touchstart', startMusic);
  document.addEventListener('click', startMusic);
  document.addEventListener('pointermove', startMusic);
  document.addEventListener('wheel', startMusic);
</script>
