<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Khunt Parivaar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="start-audio"></div>

    <audio id="bgmusic" autoplay loop muted playsinline>
        <source src="music/sound1.mp3" type="audio/mpeg">
    </audio>

    <div class="container">

        <img src="assets/1.png" class="page">
        <img src="assets/2.png" class="page">
        <img src="assets/3.png" class="page">
        <img src="assets/4.png" class="page">
        <img src="assets/5.png" class="page">
        <img src="assets/6.png" class="page">
        <img src="assets/7.png" class="page">

    </div>

</body>

</html>

<script>
    const overlay = document.getElementById("start-audio");
    const audio = document.getElementById("bgmusic");

    function enableAudio() {
        audio.muted = false;
        audio.volume = 1;
        audio.play();
        overlay.remove();
    }

    ['click', 'touchstart', 'wheel', 'keydown', 'pointerdown'].forEach(eventType => {
        document.addEventListener(eventType, enableAudio, { once: true });
    });
</script>
