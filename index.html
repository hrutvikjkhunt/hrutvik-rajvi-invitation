<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Khunt Parivaar</title>
    <link rel="stylesheet" href="style.css">
    <!-- (Removed preconnect + extra styles to restore original layout) -->
    <link href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="shortcut icon" href="assets/logo.png" type="image/png">
</head>

<body>
    <div id="start-audio"></div>

    <audio id="bgmusic" muted autoplay loop playsinline>
        <source src="assets/bg_music.mp3" type="audio/mpeg">
    </audio>

    <div id="loading" class="loading-overlay hidden" aria-live="polite" aria-busy="true">
        <img src="assets/loading.png" alt="Loading" class="loading-image" />
    </div>

    <div class="container" id="invitationContainer">
        <div class="page invitation">
            <img src="assets/1.png" />
            <div id="guestName" class="guest-name"></div>
        </div>
        <img id="page2" src="assets/2.png" class="page">
        <img id="page3" src="assets/3.png" class="page">
        <!-- Variant pages (4-7) will be injected dynamically after fetch based on haldi/mandap/sangeet/jaan values. -->

    </div>

    <div class="location-buttons" id="locationButtons" style="display:none;">
        <a href="https://maps.app.goo.gl/R5AGCNo9C5mb7X217" target="_blank" rel="noopener noreferrer"
            class="map-btn jaan-btn">
            📍 સહજ ફાર્મ
        </a>
        <a href="https://maps.app.goo.gl/spBv7As2qnrt7cCe9" target="_blank" rel="noopener noreferrer"
            class="map-btn sangeet-btn">
            📍 કલાકૃતિ ફાર્મ
        </a>
    </div>

</body>

<script>
    const audio = document.getElementById("bgmusic");
    const guestEl = document.getElementById("guestName");

    // No placeholder to avoid layout shift; text appears only when loaded.

    // Enable audio after first human gesture
    function enableAudio() {
        audio.muted = false;
        audio.play().catch(() => { });
    }

    const events = [
        'click',
        'touchstart',
        'touchmove',
        'scroll',
        'wheel',
        'pointerdown',
        'mousemove',
        'keydown'
    ];

    // Must be "once" (all lowercase)
    events.forEach(ev => {
        window.addEventListener(ev, enableAudio, { once: true, passive: true });
    });

    // Load guest only once
    async function loadGuest() {
        // Clear any previously added variant pages (supports re-run on new UUID without full reload)
        ['page4', 'page5', 'page6', 'page7'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.remove();
        });
        guestEl.textContent = '';
        guestEl.style.display = 'none';
        const params = new URLSearchParams(window.location.search);
        const uuid = params.get("uuid") || params.get("u");
        const container = document.getElementById('invitationContainer');
        const loader = document.getElementById('loading');
        if (!uuid) {
            // No uuid -> show invitation base pages only and hide guest name
            guestEl.style.display = 'none';
            container.classList.remove('hidden');
            loader.classList.add('hidden');
            return;
        }

        // Hide invitation, show loader until name is fetched
        container.classList.add('hidden');
        loader.classList.remove('hidden');

        // Always fetch fresh; no caching

        try {
            const url = "https://script.google.com/macros/s/AKfycbzlEZhRRtYleWC8b7OYU1XuX0AWi64x5H7G3t0xKLkhmsBb1cWrO9Zg6wOdI6uR0F1gYg/exec?u=" + encodeURIComponent(uuid);

            const controller = new AbortController();
            const timeoutMs = 10000; // 5s timeout fallback
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

            const res = await fetch(url, { method: 'GET', signal: controller.signal });
            clearTimeout(timeoutId);
            if (!res.ok) throw new Error("Network response not ok: " + res.status);
            let data = await res.json();
            console.log('[Invitation] Raw API data:', data);

            // Normalize to a single guest record matching the uuid
            let guestRecord = null;
            if (Array.isArray(data)) {
                guestRecord = data.find(row => String(row.uuid).trim() === uuid.trim()) || null;
            } else if (data && typeof data === 'object') {
                // If API returns single object ensure uuid matches; otherwise treat as not found
                if (String(data.uuid).trim() === uuid.trim()) guestRecord = data; else guestRecord = null;
            }

            if (!guestRecord) {
                console.warn('[Invitation] No guest found for UUID:', uuid);
                // show invitation without guest-specific pages
                loader.classList.add('hidden');
                container.classList.remove('hidden');
                return;
            }

            const name = guestRecord.name || guestRecord.guest || guestRecord.fullName;

            // Fallback if no name found
            if (!name) {
                console.warn("Guest name not found in API response", data);
                // still update pages based on whatever fields exist then show invitation
            }

            // Set guest name (if present)
            if (name) {
                guestEl.textContent = name;
                guestEl.style.display = 'block';
            }

            // Read page-variant fields and update pages accordingly
            const readField = (obj, key) => {
                if (!obj) return 0;
                const v = obj[key];
                // numeric or string -> coerce to number or 0
                return typeof v === 'number' ? v : parseInt(v) || 0;
            };

            // Extract variant values from matched record only
            const haldi = readField(guestRecord, 'haldi');
            const mandap = readField(guestRecord, 'mandap');
            const sangeet = readField(guestRecord, 'sangeet');
            const jaan = readField(guestRecord, 'jaan');

            const locationBox = document.getElementById("locationButtons");
            const sangeetBtn = document.querySelector(".sangeet-btn");
            const jaanBtn = document.querySelector(".jaan-btn");

            // show the container now that data is ready
            locationBox.style.display = "flex";

            // sangeet always visible
            sangeetBtn.style.display = "inline-block";

            // jaan only if invited
            if (guestRecord.jaan == 0 || guestRecord.jaan === "0") {
                jaanBtn.style.display = "none";
            } else {
                jaanBtn.style.display = "inline-block";
            }

            const addVariantPage = (prefix, value) => {
                if (value !== 2 && value !== 4) return; // ignore 0/invalid
                const img = document.createElement('img');
                img.id = 'page' + prefix;
                img.className = 'page';
                img.src = `assets/${prefix}-${value}.png`;
                container.appendChild(img);
            };

            addVariantPage(4, haldi);
            addVariantPage(5, mandap);
            addVariantPage(6, sangeet);
            addVariantPage(7, jaan);
            // Mark that pages reflect current uuid (optional flag if needed elsewhere)
            window.__currentGuestUuid = uuid;

            // Done -> show invitation
            loader.classList.add('hidden');
            container.classList.remove('hidden');
        } catch (e) {
            console.error("Error loading guest:", e);
            // Show invitation even if failed (name blank)
            loader.classList.add('hidden');
            container.classList.remove('hidden');
            guestEl.style.display = 'none'; // hide if fetch failed
        }
    }

    // Single invocation after DOM ready (removed body onload to prevent duplicates)
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => loadGuest(), { once: true });
    } else {
        loadGuest();
    }
</script>

</html>
