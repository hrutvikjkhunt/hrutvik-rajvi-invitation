<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Khunt Parivaar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <audio id="bgmusic" autoplay loop muted>
        <source src="music/sound1.mp3" type="audio/mpeg">
    </audio>

    <div class="container">

        <img src="assets/1.png" class="page">
        <img src="assets/2.png" class="page">
        <img src="assets/3.png" class="page">
        <img src="assets/4.png" class="page">
        <img src="assets/5.png" class="page">
        <img src="assets/6.png" class="page">
        <img src="assets/7.png" class="page">

    </div>

</body>

</html>

<script>
    let started = false;
    const audio = document.getElementById("bgmusic");

    function unmuteMusic() {
        if (!started) {
            audio.muted = false;
            audio.volume = 1;
            started = true;

            document.removeEventListener('scroll', unmuteMusic);
            document.removeEventListener('touchstart', unmuteMusic);
            document.removeEventListener('click', unmuteMusic);
            document.removeEventListener('pointermove', unmuteMusic);
            document.removeEventListener('wheel', unmuteMusic);
        }
    }

    document.addEventListener('scroll', unmuteMusic);
    document.addEventListener('touchstart', unmuteMusic);
    document.addEventListener('click', unmuteMusic);
    document.addEventListener('pointermove', unmuteMusic);
    document.addEventListener('wheel', unmuteMusic);
</script>
